<!--

1) Start the HTML document.

a) Use `<!DOCTYPE html>` to define the page as an HTML5 document.

b) Open the `<html>` tag.

2) Create the head section.

a) Set the page title as "My Animal Fact File".

b) Add internal CSS using the `<style>` tag.

3) Style the main page body.

a) Add a dark green background colour.

b) Set the font family to Arial.

4) Style the animal fact file box.

a) Use `.fact-file` to target the main card.

b) Add a light yellow background colour.

c) Set the text colour.

d) Set the width of the card.

e) Add padding inside the card.

f) Add a solid border around the card.

g) Add margin outside the card.

5) Style the animal name.

a) Use `.animal-name` to target the heading.

b) Add a forest green colour.

c) Set the font size.

6) Style the animal details.

a) Use `.detail` to target each detail line.

b) Add a dark text colour.

7) Style the cool fact.

a) Use `.cool-fact` to target the special fact.

b) Add an orange colour.

c) Make the text italic.

8) Add the page content.

a) Create a `<div>` with the class `fact-file`.

b) Add the animal name using `<h2>`.

c) Add details for type, habitat, and diet using `<p>`.

d) Add a cool fact using `<p>`.

9) Close the `<body>` and `<html>` tags to complete the webpage.

-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Animal Fact File</title>
    <style>
    body{
        background-color: darkgreen;
        font-family: Arial, Helvetica, sans-serif;
    }
    .fact-file{
        width: 260px;
        padding: 25px;
        border:4px solid forestgreen;
        margin: 30px;
    }
    .animal-name{
        font-size:22px ;
    }
    /* Page background — sets the colour and font for the whole page */

body {

background-color: darkgreen;

font-family: Arial, sans-serif;

}

/* Box Model — width sets the content area

padding pushes the text away from the edges

border draws a visible frame around the fact file

margin pushes the fact file away from the screen edge */

.fact-file {

background-color: lightyellow;

color: darkslategray;

width:300px;

padding: 50px;

border: 4px solid forestgreen;

margin: 30px;

}

/* Animal name — forestgreen so it stands out */

.animal-name {

color: forestgreen;

font-size: 22px;

}

/* Detail rows — dark text on the light background */

.detail {

color: darkslategray;

}

/* Cool fact — orange and italic to make it feel special */

.cool-fact {

color: darkorange;

font-style: italic;

}
    </style>
</head>
<body>
<div class="fact-file">

    <h2 class="animal-name">Snow Leopard</h2>

    <p class="detail">Type: Big Cat</p>

    <p class="detail">Lives in: Mountain ranges of Central Asia</p>

    <p class="detail">Diet: Deer, goats, and wild sheep</p>

    <p class="cool-fact">Cool Fact: Can leap up to 15 metres in one jump!</p>

</div>
</body>
</html>
